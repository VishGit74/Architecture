<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Capital Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 30px; font-size: 2em; }
        .input-group { margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #667eea; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button.danger {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
        }
        button.warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.success { background: #d4edda; color: #155724; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        .capital-name { font-size: 1.5em; font-weight: bold; margin-top: 10px; }
        .capital-image {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .no-image {
            margin-top: 15px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            color: #666;
            font-style: italic;
        }
        .countries-list { margin-top: 30px; text-align: left; }
        .countries-list h3 { color: #333; margin-bottom: 15px; cursor: pointer; }
        .countries-list h3:hover { color: #667eea; }
        .list-container {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .list-container.show { display: block; }
        .list-container span {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            margin: 3px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
        }
        .list-container span:hover { background: #764ba2; }
        .divider {
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 30px 0;
        }
        .section h2 { color: #333; margin-bottom: 20px; font-size: 1.5em; }
        .section .input-group { margin-bottom: 15px; }
        .section label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Country Capital Finder</h1>

        <div class="input-group">
            <input type="text" id="countryInput" placeholder="Enter a country name..." autocomplete="off">
        </div>
        <button onclick="findCapital()">Find Capital</button>
        <div id="result" class="result"></div>

        <div class="countries-list">
            <h3 onclick="toggleList()">Available Countries (click to show/hide)</h3>
            <div id="countriesList" class="list-container"></div>
        </div>

        <div class="divider"></div>

        <div class="section">
            <h2>Add New Country</h2>
            <div class="input-group">
                <label for="newCountry">Country Name</label>
                <input type="text" id="newCountry" placeholder="Enter country name...">
            </div>
            <div class="input-group">
                <label for="newCapital">Capital City</label>
                <input type="text" id="newCapital" placeholder="Enter capital city...">
            </div>
            <button onclick="addCapital()">Add Country</button>
            <div id="addResult" class="result"></div>
        </div>

        <div class="divider"></div>

        <div class="section">
            <h2>Update Capital</h2>
            <div class="input-group">
                <label for="updateCountry">Country Name</label>
                <input type="text" id="updateCountry" placeholder="Enter existing country...">
            </div>
            <div class="input-group">
                <label for="updateCapital">New Capital City</label>
                <input type="text" id="updateCapital" placeholder="Enter new capital...">
            </div>
            <button class="warning" onclick="updateCapital()">Update Capital</button>
            <div id="updateResult" class="result"></div>
        </div>

        <div class="divider"></div>

        <div class="section">
            <h2>Delete Country</h2>
            <div class="input-group">
                <label for="deleteCountry">Country Name</label>
                <input type="text" id="deleteCountry" placeholder="Enter country to delete...">
            </div>
            <button class="danger" onclick="deleteCountry()">Delete Country</button>
            <div id="deleteResult" class="result"></div>
        </div>
    </div>

    <script>
        window.onload = function() { refreshCountriesList(); };

        function toggleList() {
            document.getElementById('countriesList').classList.toggle('show');
        }

        function refreshCountriesList() {
            fetch('/get_countries')
                .then(response => response.json())
                .then(countries => {
                    const container = document.getElementById('countriesList');
                    container.innerHTML = '';
                    countries.forEach(country => {
                        const span = document.createElement('span');
                        span.textContent = country;
                        span.onclick = function() {
                            document.getElementById('countryInput').value = country;
                            findCapital();
                        };
                        container.appendChild(span);
                    });
                });
        }

        function findCapital() {
            const country = document.getElementById('countryInput').value;
            const resultDiv = document.getElementById('result');

            if (!country.trim()) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter a country name.';
                return;
            }

            const formData = new FormData();
            formData.append('country', country);

            fetch('/get_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let html = `The capital of <strong>${data.country}</strong> is:
                                    <div class="capital-name">${data.capital}</div>`;
                        if (data.image_url) {
                            html += `<img src="${data.image_url}" alt="${data.capital}" class="capital-image">`;
                        } else {
                            html += `<div class="no-image">No image available for ${data.capital}</div>`;
                        }
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = html;
                    } else {
                        resultDiv.className = 'result error';
                        resultDiv.innerHTML = data.message;
                    }
                })
                .catch(error => {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = 'An error occurred. Please try again.';
                });
        }

        document.getElementById('countryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') findCapital();
        });

        function addCapital() {
            const country = document.getElementById('newCountry').value;
            const capital = document.getElementById('newCapital').value;
            const resultDiv = document.getElementById('addResult');

            if (!country.trim() || !capital.trim()) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter both country and capital.';
                return;
            }

            const formData = new FormData();
            formData.append('country', country);
            formData.append('capital', capital);

            fetch('/add_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'result success' : 'result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('newCountry').value = '';
                        document.getElementById('newCapital').value = '';
                        refreshCountriesList();
                    }
                })
                .catch(error => {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = 'An error occurred. Please try again.';
                });
        }

        function updateCapital() {
            const country = document.getElementById('updateCountry').value;
            const capital = document.getElementById('updateCapital').value;
            const resultDiv = document.getElementById('updateResult');

            if (!country.trim() || !capital.trim()) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter both country and new capital.';
                return;
            }

            const formData = new FormData();
            formData.append('country', country);
            formData.append('capital', capital);

            fetch('/update_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'result success' : 'result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('updateCountry').value = '';
                        document.getElementById('updateCapital').value = '';
                    }
                })
                .catch(error => {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = 'An error occurred. Please try again.';
                });
        }

        function deleteCountry() {
            const country = document.getElementById('deleteCountry').value;
            const resultDiv = document.getElementById('deleteResult');

            if (!country.trim()) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter a country name.';
                return;
            }

            if (!confirm(`Are you sure you want to delete "${country}"?`)) return;

            const formData = new FormData();
            formData.append('country', country);

            fetch('/delete_country', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'result success' : 'result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('deleteCountry').value = '';
                        refreshCountriesList();
                    }
                })
                .catch(error => {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = 'An error occurred. Please try again.';
                });
        }

        document.getElementById('newCapital').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addCapital();
        });
        document.getElementById('updateCapital').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') updateCapital();
        });
        document.getElementById('deleteCountry').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') deleteCountry();
        });
    </script>
</body>
</html>
