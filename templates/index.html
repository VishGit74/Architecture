<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Capital Finder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-align: center;
        }
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-section input {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }
        .search-section input:focus { border-color: #667eea; }
        .search-section button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .search-section button:hover { opacity: 0.9; }
        .result {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }
        .result.success { background: #d4edda; color: #155724; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        .result img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .capital-name { font-size: 1.3em; font-weight: bold; margin-top: 5px; }
        .countries-bar {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-height: 80px;
            overflow-y: auto;
        }
        .countries-bar span {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            margin: 2px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .countries-bar span:hover { background: #764ba2; }
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab:hover { color: #667eea; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-row input {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        .form-row input:focus { border-color: #667eea; }
        .form-row input[type="file"] {
            padding: 8px;
            font-size: 12px;
        }
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }
        .btn-add { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-update { background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%); }
        .btn-delete { background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%); }
        .action-btn:hover { opacity: 0.9; }
        .action-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .action-result.success { background: #d4edda; color: #155724; display: block; }
        .action-result.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Country Capital Finder</h1>

        <div class="search-section">
            <input type="text" id="countryInput" placeholder="Enter a country name..." autocomplete="off">
            <button onclick="findCapital()">Search</button>
        </div>

        <div id="result" class="result"></div>

        <div class="countries-bar" id="countriesList"></div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('add')">Add</div>
            <div class="tab" onclick="showTab('update')">Update</div>
            <div class="tab" onclick="showTab('delete')">Delete</div>
        </div>

        <div id="tab-add" class="tab-content active">
            <div class="form-row">
                <input type="text" id="newCountry" placeholder="Country">
                <input type="text" id="newCapital" placeholder="Capital">
            </div>
            <div class="form-row">
                <input type="file" id="newImage" accept="image/*">
                <button class="action-btn btn-add" onclick="addCapital()">Add</button>
            </div>
            <div id="addResult" class="action-result"></div>
        </div>

        <div id="tab-update" class="tab-content">
            <div class="form-row">
                <input type="text" id="updateCountry" placeholder="Country">
                <input type="text" id="updateCapital" placeholder="New Capital">
                <button class="action-btn btn-update" onclick="updateCapital()">Update</button>
            </div>
            <div id="updateResult" class="action-result"></div>
        </div>

        <div id="tab-delete" class="tab-content">
            <div class="form-row">
                <input type="text" id="deleteCountry" placeholder="Country to delete">
                <button class="action-btn btn-delete" onclick="deleteCountry()">Delete</button>
            </div>
            <div id="deleteResult" class="action-result"></div>
        </div>
    </div>

    <script>
        window.onload = function() { refreshCountriesList(); };

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'add' ? 1 : tab === 'update' ? 2 : 3})`).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function refreshCountriesList() {
            fetch('/get_countries')
                .then(response => response.json())
                .then(countries => {
                    const container = document.getElementById('countriesList');
                    container.innerHTML = countries.map(c => 
                        `<span onclick="document.getElementById('countryInput').value='${c}';findCapital();">${c}</span>`
                    ).join('');
                });
        }

        function findCapital() {
            const country = document.getElementById('countryInput').value;
            const resultDiv = document.getElementById('result');
            if (!country.trim()) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter a country name.';
                return;
            }
            const formData = new FormData();
            formData.append('country', country);
            fetch('/get_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `The capital of <strong>${data.country}</strong> is: <div class="capital-name">${data.capital}</div><img src="${data.image_url}" alt="${data.capital}">`;
                    } else {
                        resultDiv.className = 'result error';
                        resultDiv.innerHTML = data.message;
                    }
                });
        }

        document.getElementById('countryInput').addEventListener('keypress', e => { if (e.key === 'Enter') findCapital(); });

        function addCapital() {
            const country = document.getElementById('newCountry').value;
            const capital = document.getElementById('newCapital').value;
            const imageFile = document.getElementById('newImage').files[0];
            const resultDiv = document.getElementById('addResult');
            if (!country.trim() || !capital.trim()) {
                resultDiv.className = 'action-result error';
                resultDiv.innerHTML = 'Please enter both fields.';
                return;
            }
            const formData = new FormData();
            formData.append('country', country);
            formData.append('capital', capital);
            if (imageFile) formData.append('image', imageFile);
            fetch('/add_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'action-result success' : 'action-result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('newCountry').value = '';
                        document.getElementById('newCapital').value = '';
                        document.getElementById('newImage').value = '';
                        refreshCountriesList();
                    }
                });
        }

        function updateCapital() {
            const country = document.getElementById('updateCountry').value;
            const capital = document.getElementById('updateCapital').value;
            const resultDiv = document.getElementById('updateResult');
            if (!country.trim() || !capital.trim()) {
                resultDiv.className = 'action-result error';
                resultDiv.innerHTML = 'Please enter both fields.';
                return;
            }
            const formData = new FormData();
            formData.append('country', country);
            formData.append('capital', capital);
            fetch('/update_capital', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'action-result success' : 'action-result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('updateCountry').value = '';
                        document.getElementById('updateCapital').value = '';
                    }
                });
        }

        function deleteCountry() {
            const country = document.getElementById('deleteCountry').value;
            const resultDiv = document.getElementById('deleteResult');
            if (!country.trim()) {
                resultDiv.className = 'action-result error';
                resultDiv.innerHTML = 'Please enter a country name.';
                return;
            }
            if (!confirm(`Delete "${country}"?`)) return;
            const formData = new FormData();
            formData.append('country', country);
            fetch('/delete_country', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    resultDiv.className = data.success ? 'action-result success' : 'action-result error';
                    resultDiv.innerHTML = data.message;
                    if (data.success) {
                        document.getElementById('deleteCountry').value = '';
                        refreshCountriesList();
                    }
                });
        }
    </script>
</body>
</html>
