name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install flask pytest boto3 Pillow psycopg2-binary

      - name: Check syntax
        run: python -m py_compile app.py

      - name: Run tests
        env:
          USE_SQLITE: 'true'
          DATABASE_FILE: 'test_countries.db'
        run: pytest test_app.py -v

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    steps:
      - name: Deploy to Staging
        run: |
          cd ~/Architecture-staging
          git pull origin dev
          pip3 install -r requirements.txt --quiet
          sudo systemctl restart flask-staging
          sleep 3
          curl -s http://localhost:5001 | grep -q "Country Capital" && echo "✓ Staging deployment successful!" || exit 1

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy to Production
        run: |
          cd ~/Architecture
          git pull origin main
          pip3 install -r requirements.txt --quiet
          sudo systemctl restart flask-app
          sleep 3
          curl -s http://localhost:5000 | grep -q "Country Capital" && echo "✓ Production deployment successful!" || exit 1

  notify-success:
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Deployment Successful - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: |
            Deployment completed successfully!
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            
            URLs:
            - Staging: http://54.89.187.42:5001
            - Production: http://54.89.187.42:5000

  notify-failure:
    needs: [test, deploy-staging, deploy-production]
    if: always() && (needs.test.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Deployment Failed - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: |
            Deployment failed!
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            
            Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
