name: Python Syntax and Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flask pytest boto3 Pillow psycopg2-binary

      - name: Check syntax
        run: |
          python -m py_compile app.py

      - name: Run tests
        env:
          USE_SQLITE: 'true'
          DATABASE_FILE: 'test_countries.db'
        run: |
          pytest test_app.py -v
